<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nexus widget preview</title>
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        src: url('../assets/widget-fonts/InstrumentSans-Medium.ttf')
          format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('../assets/widget-fonts/InstrumentSerif-Regular.ttf')
          format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      .widget {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        border-radius: 48px;
        background: #f5f1e8;
        color: #191610;
        font-family: 'Instrument Sans', sans-serif;
      }

      .header {
        position: absolute;
        top: 74px;
        left: 72px;
        right: 72px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 36px;
        line-height: 1;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      .eyebrow {
        color: #ff5a2b;
      }

      .date {
        color: #6c6457;
        letter-spacing: 3px;
      }

      .title {
        position: absolute;
        top: 224px;
        left: 72px;
        margin: 0;
        font-family: 'Instrument Serif', serif;
        font-size: 102px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .host {
        position: absolute;
        top: 354px;
        left: 72px;
        margin: 0;
        font-size: 40px;
        line-height: 1;
        white-space: nowrap;
      }

      .host .sep,
      .host .read {
        color: #6c6457;
      }

      .rule {
        position: absolute;
        top: 504px;
        left: 72px;
        right: 72px;
        height: 2px;
        background: #e4dcce;
      }

      .footer {
        position: absolute;
        top: 538px;
        left: 72px;
        right: 72px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 5.5px;
        text-transform: uppercase;
      }

      .cta {
        color: #ff5a2b;
      }

      .wordmark {
        color: #6c6457;
      }
    </style>
  </head>
  <body>
    <div class="widget">
      <div class="header">
        <span class="eyebrow">Today's page</span>
        <span class="date">Oct 26</span>
      </div>
      <p class="title">The Slow Web</p>
      <p class="host">
        <span class="site">jackcheng.com</span>
        <span class="sep">&nbsp;&nbsp;·&nbsp;&nbsp;</span>
        <span class="read">6 min read</span>
      </p>
      <div class="rule"></div>
      <div class="footer">
        <span class="cta">Read today's page</span>
        <span class="wordmark">Nexus</span>
      </div>
    </div>
  </body>
</html>
