name: Android release builds

# Tag a commit (`git tag v1.0.0 && git push origin v1.0.0`) to build a release
# Android App Bundle, then attach it to a GitHub Release. Upload the `.aab` to
# Play Console.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (defaults to the tag, then package.json)'
        required: false
        type: string
      version_code:
        description: 'Android versionCode (defaults to the workflow run number)'
        required: false
        type: string
      catalog_url:
        description: 'HTTPS catalog URL (defaults to the EXPO_PUBLIC_CATALOG_URL repository variable)'
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aab:
    name: Build release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_CATALOG_URL: ${{ inputs.catalog_url || vars.EXPO_PUBLIC_CATALOG_URL }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          # GitHub Actions ubuntu-latest has Android SDK preinstalled.
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Accept licenses and install needed packages.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "platforms|build-tools" || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check catalog URL
        shell: bash
        run: |
          if [ -n "$EXPO_PUBLIC_CATALOG_URL" ] && [[ ! "$EXPO_PUBLIC_CATALOG_URL" =~ ^https:// ]]; then
            echo "::error::EXPO_PUBLIC_CATALOG_URL must use https://"
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_CATALOG_URL" ]; then
            echo "::warning::No catalog URL set. This build will use the bundled catalog only."
          fi

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          CODE="${INPUT_VERSION_CODE:-$GITHUB_RUN_NUMBER}"

          node scripts/ci/apply-version.mjs --version "$VERSION" --code "$CODE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "aab=nexus-${VERSION}-${CODE}.aab" >> "$GITHUB_OUTPUT"

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Configure Gradle memory
        shell: bash
        run: |
          # The template uses 2 GB, which is tight for R8 and four ABIs.
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties

      - name: Configure signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/ci/configure-signing.mjs
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "mode=upload key" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug key (sideload only)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release Play bundle
        working-directory: android
        env:
          EXPO_PUBLIC_CATALOG_URL: ${{ inputs.catalog_url || vars.EXPO_PUBLIC_CATALOG_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --console=plain

      - name: Verify and collect the builds
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          keytool -printcert -jarfile "$AAB" > /dev/null
          mkdir -p artifacts
          cp "$AAB" "artifacts/${{ steps.version.outputs.aab }}"
          (cd artifacts && sha256sum "${{ steps.version.outputs.aab }}" > SHA256SUMS.txt)
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Test build of Nexus ${{ steps.version.outputs.version }}.

          - **versionCode:** ${{ steps.version.outputs.code }}
          - **Commit:** \`${{ github.sha }}\`
          - **Signing:** ${{ steps.signing.outputs.mode }}
          - **Catalog:** ${EXPO_PUBLIC_CATALOG_URL:-bundled catalog only}

          **Assets**

          - \`${{ steps.version.outputs.aab }}\` — upload to Play Console.

          This is a release build with Hermes and R8 enabled. Play validates the bundle on upload.

          SHA-256 checksums are in \`SHA256SUMS.txt\`.
          EOF

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "Nexus ${GITHUB_REF_NAME#v}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
